name: Auto-create pull request

on:
  push:
    branches-ignore:
      - main
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or reuse pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE=stage
          if [ "$BRANCH" = "stage" ]; then BASE=main; fi
          if [ "$BASE" = "stage" ] && ! gh api "repos/${REPO}/branches/stage" >/dev/null 2>&1; then BASE=main; fi
          existing=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$BASE" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then exit 0; fi
          gh pr create --repo "$REPO" --head "$BRANCH" --base "$BASE" \
            --title "Merge ${BRANCH} into ${BASE}" \
            --body "Automatically opened for feature branch ${BRANCH}. Review and merge this pull request into ${BASE}."

  merge-approved-feature-pr:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action == 'submitted' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'stage'
    runs-on: ubuntu-latest
    steps:
      - name: Merge approved feature pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPO" --merge